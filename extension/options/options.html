<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../popup/popup.css">
  <title>SaaS Made Free</title>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <section>
    <h2 data-i18n="optionsLang"></h2>
    <select id="lang">
      <option value="auto">auto</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="nl">Nederlands</option>
    </select>
  </section>

  <section>
    <h2 data-i18n="optionsCustomAgent"></h2>
    <p data-i18n="optionsCustomAgentHelp"></p>
    <form id="custom-agent">
      <input name="name" type="text" placeholder="My agent">
      <input name="template" type="text" placeholder="https://my-agent.test/?q={prompt}" required>
      <button type="submit" data-i18n="optionsSave"></button>
    </form>
  </section>

  <section>
    <button id="clear-hidden" type="button" data-i18n="optionsClearHidden"></button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="options.mjs"></script>
</body>
</html>
