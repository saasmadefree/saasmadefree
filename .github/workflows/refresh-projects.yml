name: Rafraîchir les projets
# Chaque lundi, relit sur l'API GitHub les faits des projets open source
# (étoiles, dernier commit, création, archivage) et propose le résultat en
# pull request. Jamais de push sur main : la PR passe par la revue comme le
# reste. Aucune action tierce : checkout et setup-node (officielles GitHub),
# puis git et `gh`, déjà présents sur le runner.
#
# Les PR ouvertes avec le GITHUB_TOKEN du workflow ne déclenchent pas les
# autres workflows (garde-fou de GitHub contre les boucles) : ci.yml ne tourne
# pas d'elle-même sur cette PR. D'où `npm run validate`, `npm run build` et
# `npx vitest run` ici, avant d'ouvrir la PR : c'est le seul passage des tests
# que cette PR reçoit. Le dépôt doit aussi autoriser GitHub Actions à créer
# des pull requests (Settings → Actions → General → Workflow permissions).
#
# Une seule branche, `chore/refresh-projects`, réécrite à chaque passage, et
# une seule PR ouverte, mise à jour au lieu d'empiler une PR datée par lundi.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-projects
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      # npm ci seul, sans jeton dans son environnement : les scripts
      # d'installation des paquets n'ont pas à voir GITHUB_TOKEN.
      - name: Installer les dépendances
        run: npm ci
      # Sort en code 1 si un dépôt est introuvable (404) ou si deux projets
      # pointent sur le même dépôt : ces cas demandent un humain, pas une PR.
      # Les doublons se fusionnent en local avec --merge-duplicates.
      - name: Rafraîchir les projets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh:projects
      - name: Valider les données
        run: npm run validate
      # Le build AVANT les tests, comme dans ci.yml : deux tests chargent des
      # fichiers générés par build-feed, et les tests sur dist/ (sitemaps,
      # hreflang, liens internes, budgets) ont besoin du site construit.
      - name: Construire le site
        run: npm run build
      - name: Tests
        run: npx vitest run
      - name: Ouvrir ou mettre à jour la pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data/projects)" ]; then
            echo "Aucun changement dans data/projects, pas de PR."
            exit 0
          fi
          date="$(date -u +%F)"
          branch="chore/refresh-projects"
          title="chore(data): stats GitHub des projets au ${date}"
          body="Rafraîchissement hebdomadaire de \`stats\` (et de \`license\` quand elle manquait) par \`npm run refresh:projects\`, depuis l'API GitHub, au ${date}. \`npm run validate\`, \`npm run build\` et \`npx vitest run\` sont passés dans le workflow (ci.yml ne tourne pas sur une PR ouverte par GITHUB_TOKEN)."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -C : la branche repart de main à chaque passage, puis --force la
          # réécrit sur le dépôt. La PR ne porte donc que le dernier relevé.
          git switch -C "$branch"
          git add -- data/projects
          git commit -m "$title"
          git push --force origin "$branch"
          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[].number' | head -n 1)"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
            echo "PR #${number} mise à jour."
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
