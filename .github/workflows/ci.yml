name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  data-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Valider les données
        run: npm run validate
      - name: Tests unitaires
        run: npx vitest run
      - name: Construire le feed
        run: npm run build
      - name: Vérifier que le build ne laisse rien de non commité
        run: git diff --exit-code
      - name: Vérifier la reproductibilité de l'extension
        run: |
          npm run build:extension
          cp build/extension.zip /tmp/first.zip
          rm build/extension.zip
          npm run build:extension
          cmp /tmp/first.zip build/extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            build/extension.zip
            build/extension.zip.sha256

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # worker/src/index.mjs importe worker/src/slugs.generated.mjs, généré par
      # le build racine et ignoré par git (voir .gitignore). Sans cette étape,
      # l'import échoue au chargement et vote.test.mjs entier est silencieusement
      # ignoré par vitest — 7 tests passent au lieu des 22 réels.
      - name: Installer les dépendances racine
        run: npm ci
      - name: Générer worker/src/slugs.generated.mjs
        run: npm run build
      - name: Installer les dépendances du worker
        working-directory: worker
        run: npm ci
      - name: Tests du worker
        working-directory: worker
        run: npx vitest run
