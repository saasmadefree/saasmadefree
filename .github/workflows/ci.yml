name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # Après le cron du Worker (02:10 UTC, expireSlots) : le slot est déjà
    # libéré en base quand la page se reconstruit, donc l'état commercial et
    # la page publiée s'accordent dans la même nuit.
    - cron: '17 3 * * *'

jobs:
  # Code et données ensemble : ce job ne tourne que sur push/PR, jamais sur le
  # planning nocturne. Sans ce `if`, `npm run validate` peut virer rouge à
  # 3h17 du matin sans qu'aucun commit n'y soit pour rien (un prix a
  # simplement dépassé MAX_PRICE_AGE_DAYS) — mélangé aux vrais échecs de code,
  # ce rouge-là entraîne à ignorer la CI. Voir le job `data-freshness` pour ce
  # signal, isolé.
  data-and-code:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Valider les données
        run: npm run validate
      # Le build AVANT les tests, pour la même raison que dans le job `worker`
      # ci-dessous : `worker/src/sponsor-inventory.generated.mjs` est produit
      # par scripts/build-feed.mjs et ignoré par git (voir .gitignore), et deux
      # tests racine le chargent dès la collecte —
      # tests/sponsor-inventory-generated.test.mjs directement,
      # tests/sponsor-checkout-urls.test.mjs via worker/src/sponsors.mjs. Sur
      # une copie fraîche du dépôt, les lancer d'abord fait échouer ces deux
      # fichiers entiers ("Cannot find module") ; en local ça passe seulement
      # parce qu'un build précédent a laissé le fichier derrière lui.
      - name: Construire le feed
        run: npm run build
      # Reste immédiatement après le build : c'est le build qu'on vérifie
      # reproductible, pas l'état de l'arbre après les tests.
      - name: Vérifier que le build ne laisse rien de non commité
        run: git diff --exit-code
      - name: Tests unitaires
        run: npx vitest run
      - name: Vérifier la reproductibilité de l'extension
        run: |
          npm run build:extension
          cp build/extension.zip /tmp/first.zip
          rm build/extension.zip
          npm run build:extension
          cmp /tmp/first.zip build/extension.zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: |
            build/extension.zip
            build/extension.zip.sha256

  # Même raison que `data-and-code` ci-dessus : jamais sur le planning
  # nocturne, seulement sur push/PR.
  worker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # worker/src/index.mjs importe worker/src/slugs.generated.mjs, généré par
      # le build racine et ignoré par git (voir .gitignore). Sans cette étape,
      # l'import échoue au chargement et vote.test.mjs entier est silencieusement
      # ignoré par vitest — 7 tests passent au lieu des 22 réels.
      - name: Installer les dépendances racine
        run: npm ci
      - name: Générer worker/src/slugs.generated.mjs
        run: npm run build
      - name: Installer les dépendances du worker
        working-directory: worker
        run: npm ci
      - name: Tests du worker
        working-directory: worker
        run: npx vitest run

  # Fraîcheur des données, seule : ce job ne tourne que sur le planning
  # nocturne, jamais sur push/PR. Il ne fait tourner ni les tests ni le build,
  # seulement `npm run validate` — un rouge ici veut dire une seule chose,
  # qu'un prix n'a pas été revérifié depuis plus de MAX_PRICE_AGE_DAYS
  # (scripts/lib/validate-rules.mjs), jamais un bug de code introduit par un
  # commit. En le séparant de `data-and-code`, le rouge dû au seul passage du
  # temps n'entraîne plus à ignorer un rouge causé par un vrai commit.
  data-freshness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Valider les données
        run: npm run validate

  # Publie le site, sur push et chaque nuit.
  #
  # Le déploiement est piloté d'ici, et non par l'intégration git de Cloudflare
  # Pages : celle-ci a cessé de déclencher le moindre build — un push a produit
  # zéro déploiement, pas même en échec, pendant que le dernier build git datait
  # de quatre jours. Ne la « rétablis » pas sans savoir que c'est délibéré.
  #
  # C'est aussi ce qui remplace l'ancien Deploy Hook : un hook demande à
  # Cloudflare de construire DEPUIS git, donc il s'appuyait sur le mécanisme
  # précisément défaillant. Ici on construit dans le runner et on téléverse
  # l'artefact — plus aucune dépendance à cette intégration.
  #
  # Le passage nocturne sert l'expiration des sponsors (spec tâche 5) : le
  # Worker libère les slots échus en base à 02:10 UTC, mais les placements sont
  # du HTML statique issu de data/sponsors.json et ne changent qu'à un build.
  # Sans ce job, un sponsor expiré resterait affiché pendant que la base le
  # montre déjà vendable.
  deploy:
    needs: [data-and-code, worker]
    # Trois cas, qui tirent en sens opposés :
    #   - push : les deux jobs de code tournent, et un rouge doit bloquer la
    #     publication — d'où le test explicite sur leur `result` ;
    #   - planning : ces mêmes jobs sont SAUTÉS (leur `if` est faux), et un
    #     `needs` sur un job sauté saute le dépendant par défaut. Sans
    #     `!cancelled()` et sans la branche `schedule`, la reconstruction
    #     nocturne ne partirait jamais ;
    #   - pull request : jamais, une PR ne publie pas en production.
    # `needs['data-and-code']` en crochets et non en pointillé : avec des
    # tirets, `needs.data-and-code.result` se lit comme une soustraction.
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && (github.event_name == 'schedule'
          || (needs['data-and-code'].result == 'success'
              && needs.worker.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Construire le site
        run: npm run build
      - name: Publier sur Cloudflare Pages
        # Un secret absent, un build raté ou un téléversement refusé font virer
        # le job au rouge : une expiration qui n'atteint jamais le site est pire
        # qu'un job rouge. Le jeton est restreint à Pages sur ce seul compte.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=saasmadefree --branch=main
