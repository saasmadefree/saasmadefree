name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # Après le cron du Worker (02:10 UTC, expireSlots) : le slot est déjà
    # libéré en base quand la page se reconstruit, donc l'état commercial et
    # la page publiée s'accordent dans la même nuit.
    - cron: '17 3 * * *'

jobs:
  data-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Valider les données
        run: npm run validate
      - name: Tests unitaires
        run: npx vitest run
      - name: Construire le feed
        run: npm run build
      - name: Vérifier que le build ne laisse rien de non commité
        run: git diff --exit-code
      - name: Vérifier la reproductibilité de l'extension
        run: |
          npm run build:extension
          cp build/extension.zip /tmp/first.zip
          rm build/extension.zip
          npm run build:extension
          cmp /tmp/first.zip build/extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            build/extension.zip
            build/extension.zip.sha256

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # worker/src/index.mjs importe worker/src/slugs.generated.mjs, généré par
      # le build racine et ignoré par git (voir .gitignore). Sans cette étape,
      # l'import échoue au chargement et vote.test.mjs entier est silencieusement
      # ignoré par vitest — 7 tests passent au lieu des 22 réels.
      - name: Installer les dépendances racine
        run: npm ci
      - name: Générer worker/src/slugs.generated.mjs
        run: npm run build
      - name: Installer les dépendances du worker
        working-directory: worker
        run: npm ci
      - name: Tests du worker
        working-directory: worker
        run: npx vitest run

  # Reconstruit le site (spec tâche 5) : le Worker libère les slots sponsors
  # expirés en base à 02:10 UTC, mais les placements sont du HTML statique
  # généré depuis data/sponsors.json — ils ne changent qu'à un build. Sans ce
  # job, un sponsor expiré resterait affiché indéfiniment pendant que la base
  # le montre déjà vendable. `if` restreint ce job au déclenchement planifié :
  # ni un push ni une pull request ne doivent republier le site en production.
  rebuild:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la reconstruction Pages
        # Pas de secret configuré = échec bruyant et volontaire : une
        # expiration qui ne se voit jamais sur le site est pire qu'un job
        # rouge que personne n'a demandé.
        run: curl -fsS -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}"
